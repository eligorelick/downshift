name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Downshift.sln -c Release
      - name: Test
        run: dotnet run --project tests/Downshift.Tests -c Release --no-build
      - name: Upload Downshift.exe
        uses: actions/upload-artifact@v4
        with:
          name: Downshift
          path: src/Downshift/bin/Release/net472/Downshift.exe
          if-no-files-found: error
