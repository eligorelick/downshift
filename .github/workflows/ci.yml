name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Web Bluetooth does not exist in headless CI; the e2e tests use the simulated heart rate source.
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/app
      - run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/app/playwright-report
            packages/app/test-results
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Builds the app, bundles the Electron shell, then makes the installer and the portable exe.
      - run: bun run desktop:dist
      - uses: actions/upload-artifact@v7
        with:
          name: downshift-windows
          path: |
            packages/desktop/release/*.exe
          if-no-files-found: error
