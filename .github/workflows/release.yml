name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      # The tag and both package.json versions must agree, or the release page and the installer file
      # name would disagree about which version this is.
      - name: Check the tag matches the package versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop=$(node -p "require('./packages/desktop/package.json').version")
          root=$(node -p "require('./package.json').version")
          for pair in "packages/desktop/package.json:$desktop" "package.json:$root"; do
            if [ "$tag" != "${pair#*:}" ]; then
              echo "Tag $GITHUB_REF_NAME does not match ${pair%%:*} version ${pair#*:}" >&2
              exit 1
            fi
          done
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run desktop:dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The installer (nsis) and the portable exe. They are not code-signed.
          files: |
            packages/desktop/release/Downshift-*.exe
