name: Release

# Pushing a tag such as v0.1.0 builds Downshift.exe and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Downshift.sln -c Release
      - name: Test
        run: dotnet run --project tests/Downshift.Tests -c Release --no-build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" src/Downshift/bin/Release/net472/Downshift.exe --title "Downshift ${{ github.ref_name }}" --generate-notes
